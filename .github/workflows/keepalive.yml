name: 保持定时任务活跃

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 提交一个时间戳，防止 GitHub 因 60 天无提交禁用 cron
        run: |
          git config user.name "fastintel-bot"
          git config user.email "actions@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-active
          git add .last-active
          if git diff --staged --quiet; then
            echo "无变化，跳过"
          else
            git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
            git push
          fi
