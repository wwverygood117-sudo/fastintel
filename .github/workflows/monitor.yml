name: fastintel 情报巡检

# 定时策略说明：
# GitHub 的 schedule 事件对新建仓库/新账号经常不派发（本仓库实测近 3 小时 0 次触发），
# 所以主力靠「自链式」：一轮跑完由 scripts/chain.sh 调 workflow_dispatch 触发下一轮。
# 触发用的是 Actions 自带的 GITHUB_TOKEN（需要 actions: write 权限），
# 好处是不依赖个人 PAT、不会过期，用户不需要做任何后续维护。
# schedule 保留作为兜底，万一哪天 GitHub 恢复了调度，也不会重复推送（seen 去重 + concurrency 串行）。

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：normal 正常跑 / dry 只看不推 / check 只测源连通"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - dry
          - check

permissions:
  contents: read
  # 自链式触发下一轮必须有这个权限
  actions: write

# 同一时刻只允许一轮，避免 schedule 恢复后和自链式打架
concurrency:
  group: fastintel-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # 10 分钟一轮 + 扫描耗时，留足余量；被 timeout 杀掉会导致链断
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      BARK_KEY: ${{ secrets.BARK_KEY }}
      GH_TOKEN: ${{ github.token }}
      INTERVAL_SEC: "600"

    steps:
      - name: 记下开跑时间
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 恢复去重状态
        uses: actions/cache@v4
        with:
          path: data
          key: fastintel-state-${{ github.run_id }}
          restore-keys: |
            fastintel-state-

      - name: 确认 bark key 已配置
        run: |
          if [ -z "$BARK_KEY" ]; then
            echo "::error::仓库里没有 BARK_KEY 这个 Secret，推送不会发出去。到 Settings → Secrets and variables → Actions 里加一个。"
            exit 1
          fi
          echo "bark key 已就位（长度 ${#BARK_KEY}）"

      - name: 跑一轮
        run: |
          case "${{ inputs.mode }}" in
            dry)   python monitor.py --dry --force ;;
            check) python monitor.py --check ;;
            *)     python monitor.py --force ;;
          esac

      - name: 留存看板
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_id }}
          path: dashboard.html
          retention-days: 3
          if-no-files-found: ignore

      # 关键步骤：本步骤会 sleep 补齐到 10 分钟，然后触发下一轮。
      # 即使上面的扫描失败（always），链也会继续，不会因为一次报错就永久停摆。
      - name: 续上下一轮
        if: always()
        run: bash scripts/chain.sh
